name: test

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: C++ protocol tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_protocol_header.cpp -o protocol-test
          ./protocol-test
